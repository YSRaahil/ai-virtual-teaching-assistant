name: BODH AI — CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Run unit tests ──────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Create .env file
        run: |
          echo "SECRET_KEY=ci-test-secret-key" >> .env
          echo "FLASK_ENV=testing" >> .env
          echo "DB_PATH=ci_test.db" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "CHROMA_DB_PATH=./chroma_db_ci" >> .env
          echo "ANONYMIZED_TELEMETRY=False" >> .env

      - name: Lint — pyflakes
        run: |
          pip install pyflakes
          python -m pyflakes app.py embedding_service.py rag_service.py tool_service.py models.py grading.py analytics.py auth.py
        continue-on-error: true

      - name: Syntax check — py_compile
        run: |
          python -m py_compile app.py
          python -m py_compile embedding_service.py
          python -m py_compile rag_service.py
          python -m py_compile tool_service.py
          python -m py_compile models.py
          python -m py_compile grading.py
          python -m py_compile analytics.py
          python -m py_compile auth.py
          echo "All files pass syntax check"

      - name: Run Phase 1 — Embedding + RAG tests
        run: |
          pytest tests/test_phase1_embeddings.py -v --tb=short
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHROMA_DB_PATH: ./chroma_db_ci
          ANONYMIZED_TELEMETRY: "False"

      - name: Run Phase 2 — Database + models tests
        run: |
          pytest tests/test_phase2_models.py -v --tb=short
        env:
          DB_PATH: ci_test.db

      - name: Run Tool service unit tests (no server)
        run: |
          pytest tests/test_tool_service.py -v --tb=short -k "not Api"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DB_PATH: ci_test.db

      - name: Test summary
        if: always()
        run: |
          echo "================================"
          echo "  BODH AI CI — Tests complete"
          echo "================================"

  # ── Job 2: Build and push Docker image ────────────────────────────────────
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test                    # only runs if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write              # needed to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max